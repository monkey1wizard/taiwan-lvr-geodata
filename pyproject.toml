[project]
name = "taiwan-lvr-geodata"
version = "0.1.0"
description = "Versioned Taiwan LVR data processing foundations"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5.6",
    "jsonschema==4.26.0",
    "pyarrow>=25.0.1",
    "pyproj>=3.8.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
required-version = "==0.12.23"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
